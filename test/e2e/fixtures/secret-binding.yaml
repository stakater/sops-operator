# One namespace grant of a Secret role to the tenant's ServiceAccount (DESIGN.md §5.2).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .TenantSA }}-{{ .Role }}
  namespace: {{ .Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Role }}
subjects:
  - kind: ServiceAccount
    name: {{ .TenantSA }}
    namespace: {{ .TenantNamespace }}
