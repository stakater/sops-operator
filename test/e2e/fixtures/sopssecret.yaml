apiVersion: sops.stakater.com/v1alpha1
kind: SopsSecret
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  deletionPolicy: {{ .DeletionPolicy }}
  encryptedData:
{{- range $key, $value := .EncryptedData }}
    {{ $key }}: {{ $value }}
{{- end }}
  tenantRef:
    name: {{ .TenantName }}
    namespace: {{ .TenantNamespace }}
