# Plaintext before `sops encrypt`. Keys are in byte order, as `yq -i 'sort_keys(..)'` leaves them.
apiVersion: sops.stakater.com/v1alpha1
kind: SopsSecret
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  deletionPolicy: {{ .DeletionPolicy }}
  scope: {{ .Scope }}
  stringData:
{{- range $key, $value := .StringData }}
    {{ $key }}: {{ printf "%q" $value }}
{{- end }}
  tenantRef:
    name: {{ .TenantName }}
    namespace: {{ .TenantNamespace }}
