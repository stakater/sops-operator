# What the cluster admin applies for a tenant (DESIGN.md §5.2): the operator may create and act as
# ServiceAccounts in the tenant namespace, and the tenant's ServiceAccount, which the operator
# creates, owns its key and writes Secrets in each granted namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-operator
  namespace: {{ .TenantNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sops-operator-tenant
subjects:
  - kind: ServiceAccount
    name: sops-operator-controller-manager
    namespace: {{ .OperatorNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.TenantSA }}-key-owner
  namespace: {{ .TenantNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sops-key-owner
subjects:
  - kind: ServiceAccount
    name: {{ $.TenantSA }}
    namespace: {{ .TenantNamespace }}
{{- range .WriteNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.TenantSA }}-{{ $.TenantNamespace }}
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sops-secret-writer
subjects:
  - kind: ServiceAccount
    name: {{ $.TenantSA }}
    namespace: {{ $.TenantNamespace }}
{{- end }}
