apiVersion: sops.stakater.com/v1alpha1
kind: SopsSecret
metadata:
  name: db-credentials
  namespace: my-app
spec:
  deletionPolicy: Delete
  # sops encrypt --output-type json <file> | base64, where <file> holds scope and stringData
  encrypted: 
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
  tenantRef:
    name: my-team
    namespace: my-team-sops
  type: Opaque
