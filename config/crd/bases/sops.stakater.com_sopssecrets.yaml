---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sopssecrets.sops.stakater.com
spec:
  group: sops.stakater.com
  names:
    kind: SopsSecret
    listKind: SopsSecretList
    plural: sopssecrets
    singular: sopssecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef.name
      name: Tenant
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SopsSecret is a SOPS-encrypted Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          sops:
            description: SopsMetadata is the metadata block written by `sops encrypt`.
            properties:
              age:
                items:
                  description: SopsAgeRecipient is one age recipient entry of the
                    SOPS metadata.
                  properties:
                    enc:
                      minLength: 1
                      type: string
                    recipient:
                      minLength: 1
                      type: string
                  required:
                  - enc
                  - recipient
                  type: object
                minItems: 1
                type: array
              encrypted_regex:
                type: string
                x-kubernetes-validations:
                - message: encrypted_regex must be ^(data|stringData|scope)$
                  rule: self == '^(data|stringData|scope)$'
              lastmodified:
                minLength: 1
                type: string
              mac:
                minLength: 1
                type: string
              mac_only_encrypted:
                type: boolean
                x-kubernetes-validations:
                - message: mac_only_encrypted must be true
                  rule: self
              version:
                minLength: 1
                type: string
            required:
            - age
            - encrypted_regex
            - lastmodified
            - mac
            - mac_only_encrypted
            - version
            type: object
          spec:
            description: SopsSecretSpec is the encrypted definition of one Secret
              with the same name and namespace.
            properties:
              data:
                additionalProperties:
                  type: string
                description: Data holds encrypted base64 values.
                maxProperties: 256
                type: object
              deletionPolicy:
                default: Delete
                description: DeletionPolicy decides what happens to the output Secret
                  when the SopsSecret is deleted.
                enum:
                - Delete
                - Retain
                type: string
              scope:
                description: Scope is the encrypted "<namespace>/<name>" this document
                  may be decrypted into.
                minLength: 1
                type: string
              stringData:
                additionalProperties:
                  type: string
                description: StringData holds encrypted text values.
                maxProperties: 256
                type: object
              template:
                description: SecretTemplate holds metadata for the output Secret.
                properties:
                  metadata:
                    description: SecretTemplateMetadata holds labels and annotations
                      for the output Secret.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              tenantRef:
                description: TenantReference names a SopsTenant.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              type:
                default: Opaque
                enum:
                - Opaque
                - kubernetes.io/tls
                - kubernetes.io/dockerconfigjson
                - kubernetes.io/basic-auth
                - kubernetes.io/ssh-auth
                type: string
            required:
            - scope
            - tenantRef
            type: object
            x-kubernetes-validations:
