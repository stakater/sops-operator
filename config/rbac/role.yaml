---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - sops.stakater.com
  resources:
  - sopssecrets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sops.stakater.com
  resources:
  - sopssecrets/finalizers
  verbs:
  - update
- apiGroups:
  - sops.stakater.com
  resources:
  - sopssecrets/status
  - sopstenants/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sops.stakater.com
  resources:
  - sopstenants
  verbs:
  - get
  - list
  - watch
