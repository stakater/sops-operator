---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - sops.stakater.com
  resources:
  - sopssecrets
  - sopstenants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sops.stakater.com
  resources:
  - sopssecrets/finalizers
  - sopstenants/finalizers
  verbs:
  - update
- apiGroups:
  - sops.stakater.com
  resources:
  - sopssecrets/status
  - sopstenants/status
  verbs:
  - get
  - patch
  - update
