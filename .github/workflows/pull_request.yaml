name: Pull Request

on:
  pull_request:
    branches:
      - main
    # Files no build, test or generated artifact reads. The run is skipped only when every changed file matches.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/.gitignore"
      - .github/dependabot.yml

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/stakater/sops-operator

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned tools (golangci-lint, controller-gen, kustomize, setup-envtest) and envtest binaries;
      # all versions are set in the Makefile, so it is the cache key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', 'Makefile') }}
          restore-keys: golangci-lint-${{ runner.os }}-

      - name: Check generated files are up to date
        run: |
          make manifests generate csv
          go mod tidy
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # scripts/encrypt.sh with a throwaway key; shellcheck is on the runner image.
      - name: Lint and test scripts
        run: make lint-scripts test-scripts

  build:
    name: Build image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go keeps one cache per go.sum, saved by the lint/test job whose builds use other
          # flags; this job keeps its own cache for the static manager build below.
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: manager-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            manager-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            manager-build-${{ runner.os }}-

      # Compile with the Go build cache restored above; inside Docker every dependency would be
      # compiled from scratch. The image only adds the binary to the distroless base.
      - name: Build operator image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/manager-amd64 cmd/main.go
          docker build --target prebuilt \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${HEAD_SHA}" \
            -t "${IMAGE_REPOSITORY}:pr-${PR_NUMBER}-${HEAD_SHA::7}" .

      # kustomize, controller-gen, operator-sdk, opm and yq; all pinned in the Makefile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bin
          key: images-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'hack/bootstrap-tools.sh') }}

      # One operator, bundle and catalog image per pull request commit, built here without a write
      # token; the e2e job tests them and the push job publishes them unchanged.
      - name: Build bundle and catalog images
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make images TAG="pr-${PR_NUMBER}-${HEAD_SHA::7}" IMAGES_DIR="${RUNNER_TEMP}/images"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E on OLM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # kind, kustomize, controller-gen, operator-sdk, opm, sops and yq; all pinned in the Makefile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bin
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'hack/bootstrap-tools.sh') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images

      # Installs the build job's images through OLM from their catalog: kind pulls them from a registry
      # on the runner that mirrors ghcr.io, under the names they are published with. Resources must
      # match the committed golden files in test/e2e/testdata (nothing is written without -update).
      - name: Run e2e tests
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make test-e2e TAG="pr-${PR_NUMBER}-${HEAD_SHA::7}" IMAGES_DIR="${RUNNER_TEMP}/images"

      # Upgrades along the channel graph of the same catalog: published bundles from GHCR, this build
      # in place of VERSION. Runs on every pull request, since any change ships in the next upgrade.
      - name: Run upgrade tests
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make test-upgrade TAG="pr-${PR_NUMBER}-${HEAD_SHA::7}" IMAGES_DIR="${RUNNER_TEMP}/images"

      - name: Scorecard
        run: make scorecard

  # The only job with a write token. It runs no code from the pull request: it pushes the three
  # images the build job saved and the e2e job tested, under the tag computed here.
  push:
    name: Push images
    needs: e2e
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images

      - name: Push to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="pr-${PR_NUMBER}-${HEAD_SHA::7}"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for kind in operator bundle catalog; do
            docker load -i "${RUNNER_TEMP}/images/${kind}.tar"
          done
          for image in "${IMAGE_REPOSITORY}" "${IMAGE_REPOSITORY}-bundle" "${IMAGE_REPOSITORY}-catalog"; do
            docker push "${image}:${tag}"
            echo "Pushed ${image}:${tag}" >> "${GITHUB_STEP_SUMMARY}"
          done
          docker logout ghcr.io
