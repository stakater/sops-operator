name: Pull Request

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/stakater/sops-operator

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned tools (golangci-lint, controller-gen, kustomize, setup-envtest) and envtest binaries;
      # all versions are set in the Makefile, so it is the cache key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', 'Makefile') }}
          restore-keys: golangci-lint-${{ runner.os }}-

      - name: Check generated files are up to date
        run: |
          make manifests generate
          go mod tidy
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    name: Build image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Layers come from the GitHub Actions cache: the dependency download is reused while go.mod
      # and go.sum are unchanged. The image is exported as a tarball, not pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          tags: sops-operator:pr
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E on kind
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # Tests the image built above; snapshots must match the committed ones (go-snaps fails on
      # missing or changed snapshots when CI=true).
      - name: Run e2e tests
        run: |
          docker load -i "${RUNNER_TEMP}/image.tar"
          make test-e2e E2E_IMG=sops-operator:pr E2E_SKIP_BUILD=true

  # The only job with a write token. It runs no code from the pull request: it re-tags the tested
  # image under a tag computed here and pushes only that tag.
  push:
    name: Push image
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Push to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          image="${IMAGE_REPOSITORY}:pr-${PR_NUMBER}-${HEAD_SHA::7}"
          docker load -i "${RUNNER_TEMP}/image.tar"
          docker tag sops-operator:pr "${image}"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}"
          docker logout ghcr.io
          echo "Pushed ${image}" >> "${GITHUB_STEP_SUMMARY}"
