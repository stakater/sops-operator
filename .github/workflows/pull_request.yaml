name: Pull Request

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/stakater/sops-operator

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check generated files are up to date
        run: |
          make manifests generate
          go mod tidy
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${HEAD_SHA}" \
            -t sops-operator:pr .
          docker save sops-operator:pr -o "${RUNNER_TEMP}/image.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # The only job with a write token. It runs no code from the pull request: it re-tags the tested
  # image under a tag computed here and pushes only that tag.
  push:
    name: Push image
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Push to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          image="${IMAGE_REPOSITORY}:pr-${PR_NUMBER}-${HEAD_SHA::7}"
          docker load -i "${RUNNER_TEMP}/image.tar"
          docker tag sops-operator:pr "${image}"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}"
          docker logout ghcr.io
          echo "Pushed ${image}" >> "${GITHUB_STEP_SUMMARY}"
