name: Push

# Releases the next version (make next-version): the highest version catalog/channels.yaml lists, when it is
# not published yet. It gets operator, bundle and catalog images and is tagged and released. When there is no
# next version, nothing is published. Pull requests run the tests (pull_request.yaml).
on:
  push:
    branches:
      - main
    # Files no image, bundle or catalog contains; same list as pull_request.yaml.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/.gitignore"
      - .github/dependabot.yml

permissions: {}

# Releases queue instead of cancelling each other.
concurrency:
  group: push-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/stakater

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bin
          key: release-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # The next version is the highest version catalog/channels.yaml lists, when it is not published yet;
      # nothing means nothing to release.
      - name: Find the next version
        id: plan
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          make yq
          version=$(make -s next-version)
          docker logout ghcr.io
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "next version: ${version:-none, nothing to release}"

  # Runs only code from main, which passed review and the pull request checks.
  publish:
    name: Publish
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing with cosign
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # The release of VERSION: make builds and names its images v<VERSION>.
      TAG: ${{ needs.plan.outputs.version }}
      PR_TAG: ""
      # docker buildx flags every published image gets, passed to make's build targets.
      RELEASE_BUILD_ARGS: >-
        --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --push
        --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
        --label org.opencontainers.image.revision=${{ github.sha }}
    steps:
      # Registry credentials live in a per-run directory, used by docker and by opm (catalog-render).
      - name: Isolate registry credentials
        run: |
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"
          echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/docker-config/config.json" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bin
          key: release-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # The catalog image runs opm during its build, once per platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish operator image
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 make build MANAGER_BIN="dist/manager-${arch}"
          done
          make docker-build CONTAINER_TOOL="docker buildx" \
            DOCKER_BUILD_ARGS="--target prebuilt ${RELEASE_BUILD_ARGS} --label org.opencontainers.image.version=v${VERSION} \
            --metadata-file ${RUNNER_TEMP}/operator.json"
          ref="${REGISTRY}/sops-operator@$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/operator.json")"
          cosign sign --yes "${ref}"
          echo "OPERATOR_REF=${ref}" >> "${GITHUB_ENV}"

      # The bundle references the operator image by digest. OLM's unpack Job pulls the bundle on a
      # cluster node, so it is published for every platform the operator runs on.
      - name: Publish bundle image
        run: |
          make bundle IMG="${OPERATOR_REF}"
          make bundle-build CONTAINER_TOOL="docker buildx" \
            DOCKER_BUILD_ARGS="${RELEASE_BUILD_ARGS} --metadata-file ${RUNNER_TEMP}/bundle.json"
          cosign sign --yes \
            "${REGISTRY}/sops-operator-bundle@$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/bundle.json")"

      # Renders every bundle catalog/channels.yaml lists, this release's from the image just pushed; any bundle
      # that cannot be pulled, or a broken graph, fails here.
      - name: Publish catalog image
        run: |
          make catalog-render
          make catalog-build CONTAINER_TOOL="docker buildx" \
            DOCKER_BUILD_ARGS="${RELEASE_BUILD_ARGS} --metadata-file ${RUNNER_TEMP}/catalog.json \
            -t ${REGISTRY}/sops-operator-catalog:latest"
          cosign sign --yes \
            "${REGISTRY}/sops-operator-catalog@$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/catalog.json")"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

      # Clusters pull these images without credentials, and only images signed by this workflow on main
      # are accepted as releases.
      - name: Verify the published images are public and signed
        run: |
          for ref in "${REGISTRY}/sops-operator:v${VERSION}" "${REGISTRY}/sops-operator-bundle:v${VERSION}" \
            "${REGISTRY}/sops-operator-catalog:v${VERSION}" "${REGISTRY}/sops-operator-catalog:latest"; do
            DOCKER_CONFIG="$(mktemp -d)" docker manifest inspect "${ref}" > /dev/null \
              || { echo "::error::${ref} cannot be pulled anonymously; make the package public"; exit 1; }
            cosign verify "${ref}" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/push.yaml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done

  # Tags and releases a newly published version; catalog-only changes are not releases.
  release:
    name: Release
    needs: [plan, publish]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          notes="Images, signed with cosign (keyless, by this repository's push workflow on main):

          - \`${REGISTRY}/sops-operator:v${VERSION}\`
          - \`${REGISTRY}/sops-operator-bundle:v${VERSION}\`
          - \`${REGISTRY}/sops-operator-catalog:v${VERSION}\`"
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "v${VERSION}" --generate-notes --notes "${notes}"
